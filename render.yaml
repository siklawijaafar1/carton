# Blueprint Render pour l'API Sceau (https://render.com/docs/blueprint-spec)
# Le site (web/) est déployé séparément sur Vercel, racine « web ».
services:
  - type: web
    name: sceau-api
    runtime: node
    plan: free # passer en « starter » pour éviter la mise en veille après 15 min d'inactivité
    region: frankfurt
    rootDir: api
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL # Supabase → Connect → Session pooler (IPv4)
        sync: false
      - key: PUBLIC_API_URL # ex. https://sceau-api.onrender.com
        sync: false
      - key: PUBLIC_WEB_URL # ex. https://sceau.vercel.app
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: sceau
      # Démo sans CinetPay : page de paiement simulée. Sans effet dès que les clés
      # CinetPay sont renseignées ; à supprimer avant l'ouverture au public.
      - key: ALLOW_PAYMENT_SIMULATION
        value: "true"
      - key: CINETPAY_API_KEY
        sync: false
      - key: CINETPAY_SITE_ID
        sync: false
      - key: CINETPAY_SECRET_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: POLLINATIONS_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: ORANGE_SMS_CLIENT_ID
        sync: false
      - key: ORANGE_SMS_CLIENT_SECRET
        sync: false
      - key: ORANGE_SMS_SENDER
        sync: false
